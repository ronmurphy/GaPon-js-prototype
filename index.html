<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaPon — daily capsule machines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <span class="brand">GaPon</span>
    <span class="tagline">daily capsule machines</span>
    <span class="hchip coin-chip"><span class="msr">toll</span><span id="coin-count">0</span></span>
    <span class="hchip streak-chip"><span class="msr">local_fire_department</span><span id="streak-count">0</span></span>
    <button class="hchip icon-chip" id="toggle-sound" title="sound on/off"><span class="msr">volume_up</span></button>
  </header>

  <nav class="tabs">
    <button data-tab="machines" class="active"><span class="msr">featured_seasonal_and_gifts</span>Shop</button>
    <button data-tab="album"><span class="msr">auto_stories</span>Album</button>
    <button data-tab="market"><span class="msr">storefront</span>Market</button>
    <button data-tab="arcade"><span class="msr">sports_esports</span>Arcade</button>
    <button data-tab="wall"><span class="msr">wallpaper</span>Wall</button>
  </nav>

  <main>
    <section id="tab-machines">
      <div class="shop" id="shop">
        <div class="shop-sign"><span class="msr">history_toggle_off</span><span id="rotate-timer"></span></div>
        <div class="special-banner">★ SPECIAL PON DAY ★</div>
        <div class="keeper-bubble" id="keeper-bubble" hidden>
          <span class="kb-face"></span><span class="kb-text"></span>
        </div>
        <div class="shop-scroll">
          <div class="shop-scene">
            <div class="dec dec-keeper" id="shopkeeper" title="chat with the shopkeeper">
              <div class="keeper-char"></div>
              <div class="keeper-counter"><span>GaPon</span></div>
              <i class="keeper-badge" id="keeper-badge" hidden>!</i>
            </div>
            <div id="machines" class="mach-row"></div>
            <div class="dec dec-window"><i class="sky"></i><i class="bars"></i></div>
            <div class="dec dec-poster">GaPon!<small>collect ’em all</small></div>
            <div class="dec dec-plant">🪴</div>
          </div>
        </div>
        <div class="shop-tint"></div>
      </div>
      <p class="shop-tip">tap a machine to step up to it</p>
    </section>
    <section id="tab-album" hidden></section>
    <section id="tab-market" hidden></section>
    <section id="tab-arcade" hidden></section>
    <section id="tab-wall" hidden></section>
  </main>

  <div id="focus-layer" hidden>
    <div class="focus-backdrop"></div>
    <div id="focus-hint" class="focus-hint"></div>
  </div>
  <div id="arcade-crt" hidden>
    <div class="crt-frame">
      <div class="crt-marquee" id="crt-title"></div>
      <div class="crt-screen">
        <div id="arcade-stage"></div>
        <i class="crt-scan"></i>
      </div>
    </div>
  </div>
  <div id="overlay" hidden></div>
  <div id="toasts"></div>

  <footer>
    <span id="stats"></span>
    <span class="foot-btns">
      <button id="toggle-art">stickers: art</button>
      <button id="export-save">backup</button>
      <button id="import-save">restore</button>
      <button id="reset-save">reset save</button>
    </span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/album.js"></script>
  <script src="js/trade.js"></script>
  <script src="js/shopkeeper.js"></script>
  <script src="js/arcade.js"></script>
  <script src="js/wall.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
