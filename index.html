<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaPon — daily capsule machines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon and install metadata. Every path here is RELATIVE on purpose:
       GitHub Pages serves this site from /GaPon-js-prototype/, so the
       generator's root-absolute "/favicon.ico" would resolve to the wrong
       host root and 404. -->
  <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
  <link rel="shortcut icon" href="assets/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="GaPon">
  <meta name="theme-color" content="#191233">
  <link rel="manifest" href="site.webmanifest">
</head>
<body>
  <header>
    <span class="brand">GaPon</span>
    <!-- Receipt for the automatic cloud upload. Sits on the LEFT on purpose:
         it's a momentary mark, not a stat, and it must not crowd the two
         numbers people actually read. -->
    <span class="save-blip" id="save-blip" hidden aria-live="polite">
      <span class="msr">cloud_done</span>
    </span>
    <span class="tagline">daily capsule machines</span>
    <span class="hchip coin-chip"><span class="msr">toll</span><span id="coin-count">0</span></span>
    <span class="hchip streak-chip"><span class="msr">local_fire_department</span><span id="streak-count">0</span></span>
    <button class="hchip icon-chip" id="toggle-sound" title="sound on/off"><span class="msr">volume_up</span></button>
    <span class="hchip fortune-chip" id="fortune-chip" hidden></span>
    <button class="hchip icon-chip flag-chip" id="toggle-theme" title="room style">🇺🇸</button>
  </header>

  <nav class="tabs">
    <button data-tab="machines" class="active"><span class="msr">featured_seasonal_and_gifts</span>Shop</button>
    <button data-tab="album"><span class="msr">auto_stories</span>Album</button>
    <button data-tab="market"><span class="msr">storefront</span>Market</button>
    <button data-tab="arcade"><span class="msr">sports_esports</span>Arcade</button>
    <button data-tab="wall"><span class="msr">photo_camera</span>Photo</button>
  </nav>

  <main>
    <section id="tab-machines">
      <div class="shop" id="shop">
        <div class="shop-sign"><span class="msr">history_toggle_off</span><span id="rotate-timer"></span></div>
        <div class="special-banner">★ SPECIAL PON DAY ★</div>
        <div class="keeper-bubble" id="keeper-bubble" hidden>
          <span class="kb-face"></span><span class="kb-text"></span>
        </div>
        <div class="shop-scroll">
          <div class="shop-scene">
            <div class="dec dec-keeper" id="shopkeeper" title="chat with the shopkeeper">
              <div class="keeper-char"></div>
              <div class="keeper-counter"><span>GaPon</span></div>
              <i class="keeper-badge" id="keeper-badge" hidden>!</i>
            </div>
            <div class="dec dec-omikuji" id="omikuji-stand" title="draw a fortune">
              <div class="omi-roof"></div>
              <div class="omi-jar"><span>み</span></div>
              <div class="omi-post"></div>
            </div>
            <div id="machines" class="mach-row"></div>
            <div class="dec dec-window"><i class="sky"></i><i class="bars"></i></div>
            <div class="dec dec-poster">GaPon!<small>collect ’em all</small></div>
            <div class="dec dec-plant">🪴</div>
            <div class="dec dec-door arcade-door" id="arcade-door" title="the back room">
              <div class="door-sign"><span></span></div>
              <div class="door-frame"><i class="door-glass"></i><i class="door-knob"></i></div>
              <div class="door-mat"></div>
            </div>
            <div class="dec dec-door" id="parlour-door" title="the room at the end of the hall">
              <div class="door-sign"><span></span></div>
              <div class="door-frame"><i class="door-glass"></i><i class="door-knob"></i></div>
              <div class="door-mat"></div>
            </div>
          </div>
        </div>
        <div class="shop-tint"></div>
      </div>
      <p class="shop-tip">tap a machine to step up to it</p>

      <div class="parlour" id="parlour" hidden>
        <div class="parlour-sign"><span id="parlour-name"></span></div>
        <button class="parlour-exit" id="parlour-exit">
          <span class="msr">door_back</span> back to the shop
        </button>
        <div class="parlour-scroll">
          <div class="parlour-scene" id="corinth-row"></div>
        </div>
        <div class="shop-tint"></div>
      </div>
      <p class="shop-tip" id="parlour-tip" hidden>25 coins · aim three balls · the edges pay best</p>
    </section>
    <section id="tab-album" hidden></section>
    <section id="tab-market" hidden></section>
    <section id="tab-arcade" hidden></section>
    <section id="tab-wall" hidden></section>
  </main>

  <div id="focus-layer" hidden>
    <div class="focus-backdrop"></div>
    <div id="focus-hint" class="focus-hint"></div>
  </div>
  <div id="arcade-crt" hidden>
    <div class="crt-frame">
      <div class="crt-marquee" id="crt-title"></div>
      <div class="crt-screen">
        <div id="arcade-stage"></div>
        <i class="crt-scan"></i>
      </div>
    </div>
  </div>
  <div id="overlay" hidden></div>
  <div id="toasts"></div>

  <footer>
    <span id="stats"></span>
    <span class="foot-btns">
      <button id="toggle-art">stickers: art</button>
      <button id="export-save">backup</button>
      <button id="import-save">restore</button>
      <button id="reset-save">reset save</button>
    </span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/tradeids.js"></script>
  <script src="js/art.js"></script>
  <script src="js/crypt.js"></script>
  <script src="js/game.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/album.js"></script>
  <script src="js/net.js"></script>
  <script src="js/trade.js"></script>
  <script src="js/swap.js"></script>
  <script src="js/photo.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/props.js"></script>
  <script src="js/webview.js"></script>
  <script src="js/shopkeeper.js"></script>
  <script src="js/arcade.js"></script>
  <script src="js/omikuji.js"></script>
  <script src="js/pusher.js"></script>
  <script src="js/corinth.js"></script>
  <script src="js/wall.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
